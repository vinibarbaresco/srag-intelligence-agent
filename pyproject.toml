[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
# Somente os diretorios de dados/artefatos da raiz: um padrao com barra e
# relativo ao projeto e nao exclui pacotes homonimos como src/data/.
extend-exclude = ["data/*", "outputs/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
