name: Monitoramento agendado

# Executa o agente sobre a base atual do DATASUS toda segunda-feira e publica o
# relatorio como artefato do workflow. Se alguma regra de alerta disparar
# (crescimento, letalidade ou excesso sazonal acima do limiar), `main.py`
# encerra com codigo 2 e o job fica vermelho -- e assim que a mudanca de
# cenario chega a quem acompanha o repositorio, sem ninguem precisar abrir o
# relatorio.
#
# Sem `OPENAI_API_KEY` nos segredos do repositorio a execucao usa a via
# deterministica; com a chave, a interpretacao e a revisao semantica pelo
# modelo entram automaticamente.
on:
  schedule:
    - cron: "0 9 * * 1" # segundas, 09:00 UTC
  workflow_dispatch:
    inputs:
      uf:
        description: "Recorte por UF (vazio = nacional)"
        required: false
        default: ""
      anos:
        description: "Anos do DATASUS a carregar (baseline sazonal precisa de 2022-2024)"
        required: false
        default: "2022 2023 2024 2025 2026"

permissions:
  contents: read

jobs:
  monitorar:
    name: Relatorio de SRAG
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Instalar dependencias
        # A partir do lockfile com hash (ver requirements.lock.txt e `make lock`):
        # mesma reprodutibilidade do CI de qualidade, sem a dependencia de
        # desenvolvimento (ruff, httpx) que este workflow nao usa.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      # A linha de base do schema drift (data/processed/schema_baseline.json)
      # nao e versionada (data/processed/ e gitignored de proposito -- ela e
      # derivada dos CSVs brutos do DATASUS, que tambem nao sao versionados).
      # Sem persisti-la entre execucoes, o runner efemero da Actions faz de
      # toda segunda-feira uma "primeira carga": src/data/drift.py so chama
      # compare() quando ja existe entrada para o ano, entao a deteccao
      # comparativa -- coluna sumida, mudanca de tipo, categoria nova, queda
      # de registros -- nunca dispara neste workflow, so na leitura local.
      #
      # `key` com o run_id garante que o post-step sempre grava uma entrada
      # nova (o cache nunca sobrescreve uma key existente); `restore-keys`
      # com o prefixo recupera a gravacao mais recente para restaurar. Se o
      # cache for despejado pela politica de 7 dias sem acesso do GitHub, o
      # pior caso e degradar para o comportamento de hoje (primeira carga),
      # nunca corromper nem interromper a execucao.
      - name: Restaurar linha de base do schema drift
        uses: actions/cache@v4
        with:
          path: data/processed/schema_baseline.json
          key: schema-baseline-${{ github.run_id }}
          restore-keys: |
            schema-baseline-

      - name: Preparar dados e gerar relatorio
        id: relatorio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_REFRESH_ON_RUN: "true"
          ANOS: ${{ github.event.inputs.anos || '2022 2023 2024 2025 2026' }}
          UF: ${{ github.event.inputs.uf }}
        run: |
          set +e
          ARGS="--setup --years $ANOS --fail-on-alert"
          if [ -n "$UF" ]; then ARGS="$ARGS --uf $UF"; fi
          python main.py $ARGS
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          # 2 = regra de alerta disparada: o relatorio existe e sera publicado;
          # o job falha DEPOIS do upload, para que o artefato nao se perca.
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi

      - name: Publicar relatorio, graficos, auditoria e historico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-srag-${{ github.run_id }}
          path: |
            outputs/reports/
            outputs/charts/
            outputs/audit/
            outputs/history/
          if-no-files-found: warn
          retention-days: 90

      - name: Sinalizar alerta
        if: steps.relatorio.outputs.status == '2'
        run: |
          echo "::error::Regra de alerta disparada. Consulte o relatorio no artefato do workflow."
          exit 2
